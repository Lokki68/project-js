<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Coin Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="stats">
      <p id='heads_count'>Heads: 0</p>
      <p id='tails_count'>Tails: 0</p>
    </div>
    <div class='coin' id='coin'>
      <div class='heads'>
        <img src='heads.svg'
             alt='heads'
        >
      </div>
      <div class='tails'>
        <img src='tails.svg'
             alt='tails'
        >
      </div>
    </div>
    <div class='buttons'>
      <button id='flip-button'>
        Flip coin
      </button>
      <button id='reset-button'>
        Reset
      </button>
    </div>
  </div>

  <script src='index.js'></script >

</body>
</html>
