<!doctype html>
<html lang='en'>
<head >
	<meta charset='UTF-8'>
	<meta name='viewport'
	      content='width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0'
	>
	<meta http-equiv='X-UA-Compatible'
	      content='ie=edge'
	>

	<link rel='stylesheet'
	      href='styles.css'
	>

	<title >Multi Step Form Js</title >
</head >
<body >
	<div class='container'>
		<form
		      id='form1'
		>
			<h3>Create Account</h3>
			<input type='email'
			       name='email'
			       id='email'
			       placeholder='Email Address'
			>
			<input type='password'
			       name='password'
			       id='passord'
			       placeholder='Password'
			>
			<input type='password'
			       name='confirmPassword'
			       id='confirmPassword'
			       placeholder='Confirm Password'
			>
			<div class='btn-box'>
				<button type='button' id='next1' >Next</button>
			</div>
		</form >

		<form
		      id='form2'
		>
			<h3>Social Links</h3>
			<input type='text'
			       name='instagram'
			       id='instagram'
			       placeholder='Instagram'
			>
			<input type='text'
			       name='github'
			       id='github'
			       placeholder='Github'
			>
			<input type='text'
			       name='twitter'
			       id='twitter'
			       placeholder='Twitter'
			>
			<div class='btn-box'>
				<button type='button' id='back1' >Back</button>
				<button type='button' id='next2' >Next</button>
			</div>
		</form >

		<form
				id='form3'
		>
			<h3>Social Links</h3>
			<input type='text'
			       name='firstname'
			       id='firstname'
			       placeholder='First Name'
			>
			<input type='text'
			       name='lastname'
			       id='lastname'
			       placeholder='Last Name'
			>
			<input type='text'
			       name='phonenum'
			       id='phonenum'
			       placeholder='Phone Num'
			>
			<div class='btn-box'>
				<button type='button' id='back2' >Back</button>
				<button type='button' id='submit' >Submit</button>
			</div>
		</form >

		<div class='step-row'>
			<div id='progress'></div>
			<div class='step-col'><small >Step 1</small ></div >
			<div class='step-col'><small >Step 2</small ></div >
			<div class='step-col'><small >Step 3</small ></div >
		</div>
	</div>

	<script src='index.js'></script >
</body >
</html >
